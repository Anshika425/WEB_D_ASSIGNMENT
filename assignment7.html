<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Menu Using Lists</title>
    <style>
        ul{
            list-style-type: none;
            background-color: #3333;
            overflow:hidden;
            margin:0;
            padding:0;

        }
        li{
            float: left;
        }
        li a{
            display: block;
            color:black;
            text-align:centre;
            padding:14px 16px;
            text-decoration:none;
        }
    </style>
</head>
<body>
    <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Courses</a></li>
        <li><a href="#">Contact</a></li>
    </ul>
</body>
</html>
