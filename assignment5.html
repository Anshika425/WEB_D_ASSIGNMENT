<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unordered, Ordered, and Description Lists</title>
</head>
<body>
    <h3>Unordered</h3>
    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
        </ul>
    <h3>Ordered </h3>
    <ol>
        <li>Install VS code</li>
        <li>Crete file</li>
        <li>Open in browser</li>
    </ol>
    
    <br>
    <h3>Description</h3>
    <a>HTML</a>
    <dd>Hyper text Mark Up Language</dd>
    <dt>CSS</dt>
    <dd>Cascading Style Sheets</dd>
</body>
</html>
