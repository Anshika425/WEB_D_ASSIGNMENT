<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nested and Responsive Tables</title>
    <style>
        table{
            border-collapse: collapse;
            margin: 10px;
        }
        th,td{
            border: 1px solid black;
            padding: 10px 14px;
            text-align: center;
        }
        .inner-table th,
        .inner-table td {
            padding:8px 12px;
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th>Day</th>
                <th>Lab Batches</th>
                <th>Faculty</th>
                <th>Room</th>
                <th>Time</th>
            </tr>
        </thead>
        
            <tr>
                <td rowsapn="3">Friday</td>
                <!-- Table placed inside the cell -->
                 <td>
                    <table class="inner-table">
                        <tr>
                            <th>Batches</th>
                            <th>System</th>
                            
                        </tr>
                        <tr>
                            <td>A1</td>
                            <td>PC 1-20</td>
                        </tr>
                        <tr>
                            <td>A2</td>
                            <td>PC 21-40</td>
                        </tr>
                    </thead>
                    </table>
                <tbody>
                 <tr>
                 <td>Dr. Sharma</td>
                 <td>Lab 2</td>
                 <td>2-4 PM</td>
                
                 </tr>
            
        </tbody>
    </table>
</body>
</html>
